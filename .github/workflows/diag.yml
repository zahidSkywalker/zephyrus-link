name: diag
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ssh key setup
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q || true
          eval "$(ssh-agent -s)" || true
          ssh-add ~/.ssh/id_ed25519 || true
      - name: inspect + repair relay codespace
        env:
          GH_TOKEN: ${{ secrets.KEEPER_TOKEN }}
        run: |
          set +e
          CS=$(gh codespace list -R zahidSkywalker/zephyrus-digi-art --json name --jq '.[0].name' 2>/dev/null || echo "")
          echo "codespace: $CS"
          if [ -z "$CS" ]; then echo "NO-CODESPACE" > diag.txt; exit 0; fi
          run_cs() { gh codespace ssh -c "$CS" -R zahidSkywalker/zephyrus-digi-art -- "$@" 2>&1; }
          {
            echo "== state =="
            gh codespace list -R zahidSkywalker/zephyrus-digi-art || true
            echo "== secrets count =="
            run_cs 'env | grep -cE "^(RELAY_AUTH|KAGGLE_USER|KAGGLE_TOKEN|KERNEL_SLUG|GH_LINK_TOKEN)=" || echo 0'
            echo "== node procs =="
            run_cs 'ps aux | grep "node server.js" | grep -v grep || echo NO-NODE-PROC'
            echo "== listening =="
            run_cs 'ss -tlnp 2>/dev/null | grep 7860 || echo NO-LISTENER'
            echo "== relay log =="
            run_cs 'tail -40 /tmp/zephyrus-relay.log 2>/dev/null || echo NO-RELAY-LOG'
            echo "== cloudflared =="
            run_cs 'command -v cloudflared || echo NO-CLOUDFLARED'
            echo "== repair attempt =="
            run_cs 'bash .devcontainer/start_relay.sh'
            sleep 8
            echo "== relay log after repair =="
            run_cs 'tail -40 /tmp/zephyrus-relay.log 2>/dev/null || echo NO-RELAY-LOG'
            echo "== listening after repair =="
            run_cs 'ss -tlnp 2>/dev/null | grep 7860 || echo NO-LISTENER'
          } > diag.txt 2>&1
      - name: commit diag
        run: |
          git config user.name echo-bot
          git config user.email echo@zephyrus
          git add diag.txt
          git commit -m "relay diag" || exit 0
          git push
